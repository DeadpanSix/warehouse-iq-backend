services:
  postgres:
    image: postgres:16
    container_name: warehouse_db
    restart: always
    env_file:
      - .env
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}

  backend:
    build: .
    container_name: warehouse_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    command: ["npm", "start"]
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data:
